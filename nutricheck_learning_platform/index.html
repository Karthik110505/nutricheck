<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NutriCheck Interactive Technical Learning & Project Documentation Platform - Complete code-grounded guide for major project evaluation.">
  <title>NutriCheck — Interactive Technical Learning & Defense Platform</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modules.css">
</head>
<body>

  <div class="app-layout">
    <!-- ==========================================
         SIDEBAR NAVIGATION
         ========================================== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="#module-1" class="brand-badge">
          <div class="brand-logo-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm-1 16l-4-4 1.41-1.41L11 15.17l6.59-6.59L19 10l-8 8z" />
            </svg>
          </div>
          <div class="brand-text">
            <h1>NutriCheck</h1>
            <span>Food Intelligence Platform</span>
          </div>
        </a>

        <div class="academic-badge">
          <strong>B.Tech Major Project Part 1</strong>
          RGUKT • Computer Science & Eng.
          <div style="margin-top:4px; font-size:0.7rem; color:var(--accent-emerald);">
            V. V. Karthik (R210111) • M. Uday Bhaskar (R210288)
          </div>
        </div>
      </div>

      <!-- Module Progress Tracker -->
      <div class="sidebar-progress">
        <div class="progress-header">
          <span>LEARNING MASTERY</span>
          <span id="progress-text">0 of 17 Completed (0%)</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
      </div>

      <!-- Navigation Modules List -->
      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Injected dynamically by app.js -->
      </nav>
    </aside>

    <!-- ==========================================
         MAIN VIEWPORT
         ========================================== -->
    <div class="main-viewport">
      <!-- Top Sticky Header -->
      <header class="top-header">
        <div class="header-left">
          <button class="menu-toggle" id="sidebar-toggle-btn" aria-label="Toggle Sidebar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="breadcrumbs">
            <span>NutriCheck</span> &nbsp;/&nbsp; <span class="current" id="breadcrumb-current">Module 01: Project Introduction</span>
          </div>
        </div>

        <div class="header-right">
          <!-- Search Trigger -->
          <button class="search-btn" id="search-trigger-btn" aria-label="Open Search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Search concepts, code, viva...</span>
            <kbd>Ctrl+K</kbd>
          </button>

          <!-- Dual Explanation Mode Switcher -->
          <div class="mode-toggle-wrap">
            <button class="mode-btn active" id="mode-btn-beginner">
              💡 Beginner Mode
            </button>
            <button class="mode-btn" id="mode-btn-panel">
              🛡️ Panel Defense Mode
            </button>
          </div>
        </div>
      </header>

      <!-- Active Content Container -->
      <main class="content-area" id="content-area">
        <!-- Rendered dynamically by app.js -->
      </main>
    </div>
  </div>

  <!-- ==========================================
       INTERACTIVE NODE INSPECTOR MODAL
       ========================================== -->
  <div class="node-inspector-modal" id="node-inspector-modal">
    <button class="inspector-close-btn" id="inspector-close-btn">&times;</button>
    <div id="inspector-content">
      <!-- Injected when clicking diagram nodes -->
    </div>
  </div>

  <!-- ==========================================
       GLOBAL SEARCH MODAL (CMD + K)
       ========================================== -->
  <div class="search-modal-backdrop" id="search-modal-backdrop">
    <div class="search-modal">
      <div class="search-input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" style="margin-right:12px;">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="search-modal-input" id="search-modal-input" placeholder="Search modules, Kotlin files, formulas, viva questions..." />
        <button id="search-close-btn" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.2rem;">&times;</button>
      </div>
      <div class="search-results-list" id="search-results-list">
        <!-- Dynamic search results -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/scoring-engine.js"></script>
  <script src="js/diagrams.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
